name: Docker Build Test

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t prototype-7-image:latest .
      
    - name: Verify Image Created
      run: docker images